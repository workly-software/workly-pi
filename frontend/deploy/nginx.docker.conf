server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # substitui (não acrescenta) o cabeçalho: um X-Forwarded-For enviado pelo cliente é descartado
        # e a API recebe só o endereço real da conexão, usado nos limites de tentativas.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }
    location /react-assets/ { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location /vendor/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
