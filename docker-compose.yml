services:
  web:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-workly_admin}:${MONGO_ROOT_PASSWORD:?Execute node scripts/setup-docker.cjs}@db:27017/workly?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Execute node scripts/setup-docker.cjs}
      FRONTEND_URL: http://localhost:${WEB_PORT:-8080}
      AUTO_SEED: "false"
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true

  db:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-workly_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Execute node scripts/setup-docker.cjs}
      MONGO_INITDB_DATABASE: workly
    volumes:
      - mongo-data:/data/db
      - ./init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)' localhost:27017/admin"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  db-test:
    image: mongo:8.0
    profiles: [test]
    command: ["mongod", "--bind_ip", "127.0.0.1"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-test:
    build:
      context: ./backend
      target: test
    profiles: [test]
    network_mode: service:db-test
    environment:
      WORKLY_EXIGIR_MONGO: "1"
    depends_on:
      db-test:
        condition: service_healthy

  frontend-test:
    build:
      context: ./frontend
      target: test
    profiles: [test]

volumes:
  mongo-data:
  uploads:
